# LocalStack: local AWS emulation for development
# Docs: https://docs.localstack.cloud/getting-started/

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      # 4566: the single "gateway" port that all AWS services share.
      # In real AWS, each service has its own endpoint (s3.amazonaws.com,
      # dynamodb.amazonaws.com, etc.). LocalStack multiplexes them all
      # through one port and routes based on the request headers.
      - "4566:4566"
    environment:
      # Auth token from your LocalStack account (Hobby tier = free).
      # Loaded from .env file automatically by Docker Compose.
      # Since March 2026, LocalStack requires this even for free-tier usage.
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      # Which AWS services to enable. LocalStack Hobby tier includes
      # everything we need for all 6 phases.
      - SERVICES=s3,dynamodb,sqs,sns,lambda,stepfunctions,events,logs,cloudwatch,apigateway,iam,sts
      # Region is arbitrary -- LocalStack doesn't actually care, but the
      # AWS SDK requires one. us-east-1 is the default and has the most
      # service availability in real AWS.
      - DEFAULT_REGION=us-east-1
      # Debug logging -- useful when things don't work as expected.
      # Change to INFO for less noise once you're comfortable.
      - DEBUG=0
      # Corporate proxy CA: The corporate proxy (Ion Group / sase.iongroup.com)
      # intercepts all HTTPS traffic and re-signs it with its own CA.
      # The container doesn't trust that CA by default, so we mount a combined
      # CA bundle (system CAs + corporate CA) and point all TLS libraries at it.
      # Without this, the LocalStack license check fails.
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/combined-ca-bundle.pem
      - CURL_CA_BUNDLE=/etc/ssl/certs/combined-ca-bundle.pem
      - SSL_CERT_FILE=/etc/ssl/certs/combined-ca-bundle.pem
    volumes:
      # Persist LocalStack state across container restarts.
      # Without this, every `docker compose down && up` would wipe your
      # S3 buckets, DynamoDB tables, etc. The named volume below keeps
      # the data around until you explicitly remove it.
      - localstack-data:/var/lib/localstack
      # LocalStack needs access to Docker to spin up Lambda containers.
      # When you invoke a Lambda, LocalStack actually starts a separate
      # container to run your function code -- just like real AWS does
      # (each Lambda invocation runs in its own isolated environment).
      - /var/run/docker.sock:/var/run/docker.sock
      # Combined CA bundle: system CAs + corporate proxy CA.
      # Generated by concatenating the container's /etc/ssl/certs/ca-certificates.crt
      # with the corporate proxy's CA chain (see certs/ directory).
      - ./certs/combined-ca-bundle.pem:/etc/ssl/certs/combined-ca-bundle.pem:ro
    healthcheck:
      # LocalStack exposes a health endpoint. Docker will ping it every
      # 5 seconds and mark the container as "healthy" once it responds.
      # This is useful for scripts that need to wait for LocalStack to
      # be fully ready before running (e.g., tofu apply).
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

# Named volume -- Docker manages the storage location.
# `docker volume ls` to see it, `docker volume rm` to delete.
volumes:
  localstack-data:
